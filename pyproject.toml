[project]
name = "kaic-zotero-push"
version = "0.1.0"
description = "Safely preview and import document references into Zotero."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "kaicot" }]
dependencies = [
    "httpx2[brotli,http2,zstd]",
    "keyring>=25.6",
    "openpyxl>=3.1",
    "pydantic>=2.11",
    "pymupdf>=1.26",
    "python-docx>=1.2",
    "rapidfuzz>=3.13",
    "rich>=14.1",
    "typer>=0.16",
]

[project.scripts]
kaic-zotero-push = "kaic_zotero_push.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaic_zotero_push"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
stubPath = "typings"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/.venv-verify",
    "**/build",
    "**/dist",
]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", ".venv-verify", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
"typings/**/*.pyi" = ["A001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
