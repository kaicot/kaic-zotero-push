interface:
  display_name: "KAIC Zotero Push"
  short_description: "Preview and safely import document references into Zotero."
  default_prompt: >
    Use $kaic-zotero-push to inspect the provided reference document, propose a filename-based
    collection if none is specified, show a full no-write preview, then after one explicit
    approval import only new metadata-only items into the approved personal-library destination.

policy:
  allow_implicit_invocation: true
